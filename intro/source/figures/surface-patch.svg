<circle cx="220" cy="151.66666666666669" r="4" fill="#6F6E69"/>
<line x1="70" y1="218.33333333333334" x2="270" y2="218.33333333333334" stroke="#CECDC3" stroke-width="1.5"/>
<circle cx="120" cy="218.33333333333334" r="4" fill="#6F6E69"/>
<circle cx="220" cy="218.33333333333334" r="4" fill="#6F6E69"/>
<line x1="55" y1="85" x2="285" y2="85" stroke="#1C1B1A" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="55" y1="285" x2="285" y2="285" stroke="#1C1B1A" stroke-width="1.5" stroke-dasharray="5 4"/>
