<svg xmlns="http://www.w3.org/2000/svg" role="img" width="680" height="390" viewBox="0 0 680 390" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">
<title>Two copies of the unrotated distance-three planar patch. Each has thirteen edge qubits: nine vertical and four interior horizontal. A four-edge loop bounds a face and is a stabilizer; a three-edge vertical string joins the rough boundaries and is a logical Z. Dashed boundary guides are not data-qubit edges.</title>
