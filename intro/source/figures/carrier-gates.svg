<svg xmlns="http://www.w3.org/2000/svg" role="img" width="680" height="440" viewBox="0 0 680 440" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">
<title>Three gate effects. A diagonal gate changes the phase of a permitted word, illustrated by Z on a Bell pair. CNOT relabels its permitted words from 00 and 11 to 00 and 10. A free Hadamard introduces a summed alternative, illustrated by interference turning a plus state into zero.</title>
<text x="340" y="26" text-anchor="middle" font-size="22" fill="#1C1B1A">Three ways to transform a carrier</text>
<line x1="35" y1="48" x2="645" y2="48" stroke="#CECDC3" stroke-width="1.5"/>
<line x1="35" y1="174" x2="645" y2="174" stroke="#CECDC3" stroke-width="1.5"/>
<line x1="35" y1="300" x2="645" y2="300" stroke="#CECDC3" stroke-width="1.5"/>
<text x="52" y="80" text-anchor="start" font-size="20" fill="#1C1B1A">Diagonal</text>
<text x="52" y="107" text-anchor="start" font-size="16" fill="#6F6E69">Change phases</text>
<rect x="263" y="66" width="80" height="40" fill="none" stroke="#CECDC3"/>
<text x="303" y="94" text-anchor="middle" font-size="22" fill="#1C1B1A">00</text>
<rect x="471" y="66" width="80" height="40" fill="none" stroke="#CECDC3"/>
<text x="511" y="94" text-anchor="middle" font-size="22" fill="#1C1B1A">11</text>
<text x="303" y="137" text-anchor="middle" font-size="15" fill="#6F6E69">phase unchanged</text>
<text x="511" y="137" text-anchor="middle" font-size="15" fill="#1A4F8C">phase negated by Z</text>
<text x="52" y="208" text-anchor="start" font-size="20" fill="#1C1B1A">CNOT</text>
<text x="52" y="235" text-anchor="start" font-size="16" fill="#6F6E69">Relabel words</text>
<text x="303" y="210" text-anchor="middle" font-size="22" fill="#1C1B1A">00</text>
<line x1="351" y1="203" x2="462" y2="203" stroke="#1A4F8C" stroke-width="1.5"/>
<path d="M455 198L462 203L455 208" stroke="#1A4F8C" stroke-width="1.5" fill="none"/>
<text x="511" y="210" text-anchor="middle" font-size="22" fill="#1A4F8C">00</text>
<text x="303" y="257" text-anchor="middle" font-size="22" fill="#1C1B1A">11</text>
<line x1="351" y1="250" x2="462" y2="250" stroke="#1A4F8C" stroke-width="1.5"/>
<path d="M455 245L462 250L455 255" stroke="#1A4F8C" stroke-width="1.5" fill="none"/>
<text x="511" y="257" text-anchor="middle" font-size="22" fill="#1A4F8C">10</text>
<text x="52" y="335" text-anchor="start" font-size="20" fill="#1C1B1A">Hadamard</text>
<text x="52" y="362" text-anchor="start" font-size="16" fill="#6F6E69">Mix alternatives</text>
<text x="292" y="330" text-anchor="middle" font-size="16" fill="#6F6E69">output zero</text>
<text x="510" y="330" text-anchor="middle" font-size="16" fill="#6F6E69">output one</text>
<text x="292" y="363" text-anchor="middle" font-size="24" fill="#1A4F8C">+    +</text>
<text x="510" y="363" text-anchor="middle" font-size="24" fill="#6F6E69">+    −</text>
<text x="292" y="398" text-anchor="middle" font-size="17" fill="#1A4F8C">reinforce</text>
<text x="510" y="398" text-anchor="middle" font-size="17" fill="#6F6E69">cancel</text>
<text x="340" y="433" text-anchor="middle" font-size="15" fill="#6F6E69">Gate action changes the state; a rewrite changes its presentation</text>
</svg>
