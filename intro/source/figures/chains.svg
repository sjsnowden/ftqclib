<svg xmlns="http://www.w3.org/2000/svg" role="img" width="680" height="295" viewBox="0 0 680 295" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">
<title>A filled square has four boundary edges. Taking their boundary counts each corner twice, leaving zero over binary arithmetic. This is the geometric reason a boundary has no syndrome.</title>
