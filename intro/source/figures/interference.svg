<svg xmlns="http://www.w3.org/2000/svg" role="img" width="680" height="315" viewBox="0 0 680 315" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">
<title>Two Hadamards return an initial zero qubit to zero. Both intermediate paths contribute positively to output zero; their contributions to output one have opposite signs and cancel.</title>
<text x="65" y="30" text-anchor="middle" font-size="19" fill="#1C1B1A">Input</text>
<text x="315" y="30" text-anchor="middle" font-size="19" fill="#1C1B1A">Summed bit</text>
<text x="565" y="30" text-anchor="middle" font-size="19" fill="#1C1B1A">Output</text>
<text x="185" y="58" text-anchor="middle" font-size="16" fill="#6F6E69">first H</text>
<text x="440" y="58" text-anchor="middle" font-size="16" fill="#6F6E69">second H</text>
<circle cx="65" cy="159" r="19" fill="#fff"/>
<text x="65" y="166" text-anchor="middle" font-size="23" fill="#1C1B1A">0</text>
<circle cx="315" cy="95" r="19" fill="#fff"/>
<text x="315" y="102" text-anchor="middle" font-size="23" fill="#1C1B1A">0</text>
<circle cx="315" cy="225" r="19" fill="#fff"/>
<text x="315" y="232" text-anchor="middle" font-size="23" fill="#1C1B1A">1</text>
<circle cx="565" cy="95" r="19" fill="#fff"/>
<text x="565" y="102" text-anchor="middle" font-size="23" fill="#1C1B1A">0</text>
<circle cx="565" cy="225" r="19" fill="#fff"/>
<text x="565" y="232" text-anchor="middle" font-size="23" fill="#1C1B1A">1</text>
<line x1="90" y1="155" x2="290" y2="95" stroke="#6F6E69" stroke-width="1.5"/>
<line x1="90" y1="155" x2="290" y2="225" stroke="#6F6E69" stroke-width="1.5"/>
<line x1="339" y1="95" x2="541" y2="95" stroke="#1A4F8C" stroke-width="2"/>
<line x1="339" y1="225" x2="541" y2="95" stroke="#1A4F8C" stroke-width="2"/>
<line x1="339" y1="95" x2="541" y2="225" stroke="#6F6E69" stroke-width="2"/>
<line x1="339" y1="225" x2="541" y2="225" stroke="#6F6E69" stroke-width="2"/>
<text x="450" y="87" text-anchor="middle" font-size="22" fill="#1A4F8C">+</text>
<text x="450" y="149" text-anchor="middle" font-size="22" fill="#1A4F8C">+</text>
<text x="395" y="157" text-anchor="middle" font-size="22" fill="#6F6E69">+</text>
<text x="450" y="250" text-anchor="middle" font-size="22" fill="#6F6E69">−</text>
<text x="315" y="291" text-anchor="middle" font-size="19" fill="#1A4F8C">Add amplitudes before taking probabilities</text>
<text x="610" y="100" text-anchor="middle" font-size="16" fill="#1A4F8C">add</text>
<text x="610" y="230" text-anchor="middle" font-size="16" fill="#6F6E69">cancel</text>
</svg>
