<svg xmlns="http://www.w3.org/2000/svg" role="img" width="680" height="265" viewBox="0 0 680 265" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">
<title>Commutation is a parity calculation. XX and ZZ exchange X and Z on two qubits and commute; XI and ZI exchange them on one qubit and anticommute.</title>
<text x="175" y="30" text-anchor="middle" font-size="20" fill="#1C1B1A">Two local exchanges</text>
<text x="505" y="30" text-anchor="middle" font-size="20" fill="#1C1B1A">One local exchange</text>
<rect x="71" y="58" width="68" height="111" fill="none" stroke="#CECDC3"/>
<text x="105" y="89" text-anchor="middle" font-size="25" fill="#1C1B1A">X</text>
<text x="105" y="147" text-anchor="middle" font-size="25" fill="#1C1B1A">Z</text>
<path d="M85 102L125 121 M125 102L85 121" stroke="#1A4F8C" stroke-width="2" fill="none"/>
<text x="105" y="193" text-anchor="middle" font-size="15" fill="#1A4F8C">one minus</text>
<rect x="201" y="58" width="68" height="111" fill="none" stroke="#CECDC3"/>
<text x="235" y="89" text-anchor="middle" font-size="25" fill="#1C1B1A">X</text>
<text x="235" y="147" text-anchor="middle" font-size="25" fill="#1C1B1A">Z</text>
<path d="M215 102L255 121 M255 102L215 121" stroke="#1A4F8C" stroke-width="2" fill="none"/>
<text x="235" y="193" text-anchor="middle" font-size="15" fill="#1A4F8C">one minus</text>
<rect x="401" y="58" width="68" height="111" fill="none" stroke="#CECDC3"/>
<text x="435" y="89" text-anchor="middle" font-size="25" fill="#1C1B1A">X</text>
<text x="435" y="147" text-anchor="middle" font-size="25" fill="#1C1B1A">Z</text>
<path d="M415 102L455 121 M455 102L415 121" stroke="#1A4F8C" stroke-width="2" fill="none"/>
<text x="435" y="193" text-anchor="middle" font-size="15" fill="#1A4F8C">one minus</text>
<rect x="531" y="58" width="68" height="111" fill="none" stroke="#CECDC3"/>
<text x="565" y="89" text-anchor="middle" font-size="25" fill="#1C1B1A">I</text>
<text x="565" y="147" text-anchor="middle" font-size="25" fill="#1C1B1A">I</text>
<text x="565" y="193" text-anchor="middle" font-size="15" fill="#6F6E69">no sign</text>
<text x="175" y="237" text-anchor="middle" font-size="19" fill="#1A4F8C">Even parity: commute</text>
<text x="505" y="237" text-anchor="middle" font-size="19" fill="#1A4F8C">Odd parity: anticommute</text>
</svg>
