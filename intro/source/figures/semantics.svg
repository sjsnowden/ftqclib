<svg xmlns="http://www.w3.org/2000/svg" role="img" width="680" height="270" viewBox="0 0 680 270" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif">
  <title>A correctness diagram: the original and transformed descriptions each have an interpretation. A semantic proof establishes that these interpretations give the same specified action on every input.</title>
  <defs>
    <marker id="semantics-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#6F6E69" stroke-width="1"/></marker>
  </defs>
  <text x="152" y="49" text-anchor="middle" font-size="20" fill="#1C1B1A">Original description</text>
  <text x="528" y="49" text-anchor="middle" font-size="20" fill="#1C1B1A">Transformed description</text>
  <path d="M271 43H398" fill="none" stroke="#6F6E69" stroke-width="1.6" marker-end="url(#semantics-arrow)"/>
  <text x="335" y="24" text-anchor="middle" font-size="16" fill="#6F6E69">transform</text>
  <path d="M152 75V150" fill="none" stroke="#6F6E69" stroke-width="1.6" marker-end="url(#semantics-arrow)"/>
  <path d="M528 75V150" fill="none" stroke="#6F6E69" stroke-width="1.6" marker-end="url(#semantics-arrow)"/>
  <text x="166" y="117" font-size="17" fill="#6F6E69">interpret</text>
  <text x="542" y="117" font-size="17" fill="#6F6E69">interpret</text>
  <text x="152" y="189" text-anchor="middle" font-size="20" fill="#1C1B1A">Specified action</text>
  <text x="528" y="189" text-anchor="middle" font-size="20" fill="#1C1B1A">Specified action</text>
  <path d="M263 181H416 M263 189H416" fill="none" stroke="#1A4F8C" stroke-width="2"/>
  <text x="340" y="245" text-anchor="middle" font-size="19" fill="#1A4F8C">Proof: the same action on every input</text>
</svg>
